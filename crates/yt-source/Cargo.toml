[package]
name = "yt-source"
version = "0.1.0"
edition = "2021"

[dependencies]
yt-model = { path = "../yt-model" }
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["sync", "fs", "process", "rt", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
