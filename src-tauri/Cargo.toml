[package]
name = "src-tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
player = { path = "../crates/player" }
yt-model = { path = "../crates/yt-model" }
yt-source = { path = "../crates/yt-source" }
store = { path = "../crates/store" }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false }
